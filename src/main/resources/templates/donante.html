<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Panel Donante</title>

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <header class="admin-header">
      <h1>Donante</h1>
      <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="perfil">Mi Perfil</button>

      <button class="tab-btn" data-tab="donaciones">Donar</button>

      <button class="tab-btn" data-tab="historial">Historial</button>

      <button class="tab-btn" data-tab="contacto">Contacto</button>
    </nav>

    <main class="admin-content">
      <section id="perfil" class="admin-section active">
        <h2>Mi Perfil</h2>

        <p>
          Bienvenido <strong id="nombreDonante"></strong>. Aquí puedes ver tus
          datos registrados.
        </p>

        <table class="admin-table">
          <tr>
            <th>Nombre</th>
            <td id="perfil-nombre"></td>
          </tr>

          <tr>
            <th>Correo</th>
            <td id="perfil-email"></td>
          </tr>

          <tr>
            <th>Telefono</th>
            <td id="perfil-telefono"></td>
          </tr>
        </table>
      </section>

      <section id="donaciones" class="admin-section">
        <h2>Registrar Donación</h2>

        <form id="donacionForm" class="form-donacion">
          <label>Tipo de donación:</label>
          <input type="text" id="tipo" required />

          <label>Cantidad:</label>
          <input type="number" id="cantidad" required />

          <button type="submit" class="btn-admin">Registrar</button>
        </form>
      </section>

      <section id="historial" class="admin-section">
        <h2>Historial de Donaciones</h2>

        <table class="admin-table" id="tablaHistorial">
          <thead>
            <tr>
              <th>ID</th>

              <th>Tipo</th>

              <th>Cantidad</th>
            </tr>
          </thead>

          <tbody></tbody>
        </table>
      </section>

      <section id="contacto" class="admin-section">
        <h2>Contacto con la Fundación</h2>

        <p>Si tienes alguna duda escríbenos a:</p>

        <p><strong>contacto@almora.org</strong></p>
      </section>
    </main>

    <footer class="footer-fijo">
      © 2025 Fundación ALMORA — Panel del Donante
    </footer>

    <script>
      // pestañas
      const tabs = document.querySelectorAll(".tab-btn");

      const sections = document.querySelectorAll(".admin-section");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));

          tab.classList.add("active");

          sections.forEach((sec) => {
            sec.classList.remove("active");

            if (sec.id === tab.dataset.tab) sec.classList.add("active");
          });
        });
      });

      // ⭐ obtener usuario logueado
      async function cargarPerfil() {
        try {
          const response = await fetch("/api/usuarios/perfil");

          if (!response.ok) {
            throw new Error("No se pudo cargar el perfil");
          }

          const usuario = await response.json();

          document.getElementById("nombreDonante").textContent = usuario.nombre;

          document.getElementById("perfil-nombre").textContent = usuario.nombre;

          document.getElementById("perfil-email").textContent = usuario.correo;

          document.getElementById("perfil-telefono").textContent =
            usuario.telefono ?? "No registrado";
        } catch (error) {
          console.error(error);
        }
      }

      cargarPerfil();

      // cerrar sesión
      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.location.href = "/logout";
      });
    </script>
  </body>
</html>
